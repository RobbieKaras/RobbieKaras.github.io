<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta name="author" content="{{ site.author }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="website">
<link rel="canonical" href="{% block canonical %}{{ abs_url('/') }}{% endblock %}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ url('/feed.xml') }}">
<link rel="stylesheet" href="{{ url('/static/style.css') }}">
<link rel="stylesheet" href="{{ url('/static/pygments.css') }}">
<link rel="icon" href="{{ url('/static/favicon.svg') }}" type="image/svg+xml">
<script>
/* set the theme before first paint so there is no flash */
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-name" href="{{ url('/') }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}
      <a href="{{ url(item.url) }}"{% if active == item.key %} class="is-active" aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
      <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span aria-hidden="true" data-theme-icon></span>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="wrap">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-links">
      {% for link in site.links %}
      <a href="{{ link.url }}"{% if not link.url.startswith('mailto:') %} rel="me noopener"{% endif %}>{{ link.name }}</a>
      {% endfor %}
      <a href="{{ url('/feed.xml') }}">RSS</a>
      <a href="{{ url('/tags/') }}">Tags</a>
    </p>
    <p class="footer-meta">&copy; {{ site.author }}. Built with a Python script and no framework.</p>
  </div>
</footer>

<script src="{{ url('/static/main.js') }}" defer></script>
</body>
</html>
